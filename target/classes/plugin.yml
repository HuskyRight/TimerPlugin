# Der Name deines Plugins
name: WorldTimer
# Die Version deines Plugins
version: 1.0
# Der Autor
author: Huskyright
# Der Pfad zur Hauptklasse deines Plugins
main: de.huskyright.worldtimer.TimerPlugin
# Die API-Version, die mit modernen Servern kompatibel ist
api-version: '1.21'

# Hier definieren wir unsere Befehle
commands:
  timer:
    description: Steuert den Welt-Timer.
    usage: "/timer <on|off|start|stop|reset>"
    permission: worldtimer.admin
  timermode:
    description: Setzt den Spielermodus für den Timer.
    usage: "/timermode set <Anzahl>"
    permission: worldtimer.admin

# Hier definieren wir die Berechtigungen (optional, aber guter Stil)
permissions:
  worldtimer.admin:
    description: Erlaubt die Nutzung aller Timer-Befehle.
    default: op